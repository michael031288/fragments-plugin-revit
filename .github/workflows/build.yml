name: Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Test Fragments.Core
        run: dotnet test tests/Fragments.Core.Tests/Fragments.Core.Tests.csproj -c Release --verbosity normal

  build-revit:
    name: Build Revit ${{ matrix.revit_year }}
    runs-on: windows-latest
    strategy:
      matrix:
        revit_year: [2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build & Package Revit ${{ matrix.revit_year }}
        run: powershell -ExecutionPolicy Bypass -File ./tools/pack-revit-addins.ps1 -RevitYears ${{ matrix.revit_year }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fragments.Revit-${{ matrix.revit_year }}
          path: artifacts/revit/Fragments.Revit-${{ matrix.revit_year }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [test, build-revit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloads

      - name: Flatten release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release-assets | Out-Null
          Get-ChildItem artifacts/downloads -Recurse -Filter *.zip | Copy-Item -Destination artifacts/release-assets -Force
          Get-ChildItem artifacts/release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
